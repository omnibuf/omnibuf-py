[package]
name = "omnibuf-py-ext"
version = "0.1.7"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[lib]
name = "_omnibuf_ext"
path = "rust/lib.rs"
crate-type = ["cdylib"]

[dependencies]
omnibuf_core = { package = "omnibuf", version = "0.1.8", default-features = false }
pyo3 = { version = "0.30", features = ["extension-module"] }
ryu = "1.0"
itoa = "1.0"

[build-dependencies]
pyo3-build-config = "0.30"

[profile.dev]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
