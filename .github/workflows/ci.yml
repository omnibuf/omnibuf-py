name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Python & PyO3 Format, Lint, Mypy, Pytest & Conformance
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install tools via mise
        uses: jdx/mise-action@v5
        with:
          install: true

      - name: Install rustfmt and clippy components
        run: rustup component add rustfmt clippy

      - name: Sync uv environment and build PyO3 extension
        run: just install

      - name: Install conformance-runner
        run: |
          mise use -g go@1.27
          GOBIN="$HOME/.local/bin" mise exec -- go install github.com/omnibuf/omnibuf-go/cmd/conformance-runner@v0.2.11
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run full CI suite
        run: just ci
